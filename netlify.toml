[build]
  base = "Frontend"
  publish = ".next"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://hiruacademyy.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sanctum/*"
  to = "https://hiruacademyy.onrender.com/sanctum/:splat"
  status = 200
  force = true
